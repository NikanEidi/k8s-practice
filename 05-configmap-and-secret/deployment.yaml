# Exercise 05: inject a ConfigMap and a Secret into Pods as environment variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config   # every key in app-config becomes an env var
            - secretRef:
                name: app-secret   # every key in app-secret becomes an env var
