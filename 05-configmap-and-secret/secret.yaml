# Sensitive values. Kubernetes stores these base64-encoded, NOT encrypted.
# stringData lets you write plain text here; Kubernetes encodes it on save.
# (The alternative, `data:`, requires you to base64-encode the values yourself.)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_PASSWORD: "demo-password-not-real"
  API_KEY: "demo-api-key-12345"
