# Exercise 01: a Deployment that keeps two nginx Pods running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-nginx        # must match the Pod template labels below
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27   # pinned version, not "latest"
          ports:
            - containerPort: 80
