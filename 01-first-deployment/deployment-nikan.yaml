apiVersion: apps/v1
kind: Deployment
metadata:
  name: nikan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nikan
  template:
    metadata:
      labels:
        app: nikan
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80